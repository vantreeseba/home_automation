substitutions:
  device_name: photo-frame-1
  device_friendly_name: Photo Frame 1
  display_pixel_width: '800'
  display_pixel_height: '480'
  display_rotation: '270°'
  # Longest the frame stays awake waiting for an image before it gives up and sleeps anyway.
  max_awake_time: 60s
  # Extra time awake after a refresh. Not needed normally: the frame already waits for the
  # panel to report the refresh finished before it sleeps.
  post_render_delay: 0s
  # Below this charge the frame stops refreshing and only wakes now and then to check again.
  low_battery_percent: '10'
  low_battery_sleep: 12h
  # Cut power to the audio chips and the e-paper panel while asleep. Untested: measure the
  # sleep current before leaving it on, see the notes in the on_boot PMIC lambda.
  rails_off_in_sleep: 'false'

packages:
  base:
    url: https://github.com/vantreeseba/home_automation
    ref: main
    files:
      - shared_packages/default_base.yaml

esphome:
  # First release with the sendspin image platform and no external components needed.
  min_version: 2026.9.0
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            // AXP2101 rails, all 3.3V as in Waveshare's firmware. From the board schematic:
            //   DCDC1 (0x82) = VCC3V3:    ESP32-S3, SD slot, SHTC3, user LEDs, I2C/SD pull-ups
            //   ALDO3 (0x94) = Audio_VCC: ES8311 codec, ES7210 mic ADC and both mics
            //   ALDO4 (0x95) = EPD_VCC:   e-paper panel logic and its boost driver
            //   RTCLDO       = VRTC:      PCF85063 RTC, always on
            // Every other output (ALDO1/2, BLDO1/2, DLDO1/2, DCDC2-4, CPUSLDO) is unconnected.
            // DCDC1 = 1500mV + n*100mV, ALDOs = 500mV + n*100mV.
            static const uint8_t RAILS[][2] = {{0x82, 0x12}, {0x94, 0x1C}, {0x95, 0x1C}};
            for (const auto &rail : RAILS) {
              uint8_t current;
              if (!id(pmic).read_byte(rail[0], &current)) {
                ESP_LOGW("pmic", "Could not read rail register 0x%02X", rail[0]);
                continue;
              }
              if ((current & 0x1F) != rail[1]) {
                id(pmic).write_byte(rail[0], (current & 0xE0) | rail[1]);
              }
            }
            // ALDO3 and ALDO4 enables (0x90 bits 2 and 3). The PMIC keeps its settings while
            // the ESP32 sleeps, so they are still off here if rails_off_in_sleep cut them.
            uint8_t ldo;
            if (id(pmic).read_byte(0x90, &ldo) && (ldo & 0x0C) != 0x0C) {
              id(pmic).write_byte(0x90, ldo | 0x0C);
            }
            // Battery voltage ADC channel (0x30 bit 0), read by the Battery Voltage sensor.
            uint8_t adc;
            if (id(pmic).read_byte(0x30, &adc) && !(adc & 0x01)) {
              id(pmic).write_byte(0x30, adc | 0x01);
            }
            // TODO: rails_off_in_sleep switches ALDO3 and ALDO4 off for deep sleep (see the
            // rails_off script). Untested, so measure with a meter before relying on it.
            //   ALDO3: nothing here uses audio, but the codecs share this I2C bus. If they
            //     load SDA/SCL while unpowered the PMIC becomes unreachable, and only pulling
            //     the battery recovers it.
            //   ALDO4: epaper_spi resets and fully re-initialises the panel on every update,
            //     so it does not need power in between. It goes off only once the ESP32 is
            //     about to sleep, so no driven pin back-feeds the panel.
            // Nothing else can be switched: the SD slot shares DCDC1 with the ESP32 (and
            // draws nothing while empty), and the NS4150B amplifier runs from VSYS, held in
            // shutdown by a pull-down on its CTRL pin (GPIO7).
    - priority: -100
      then:
        - script.execute: start_cycle

i2c:
  id: bus
  sda: GPIO47
  scl: GPIO48
  scan: false
  frequency: 100kHz

# AXP2101. Its other pins are wired to the ESP32 but not used here:
#   IRQ    -> GPIO21, active low, pulled up to the RTC supply
#   CHGLED -> GPIO3
#   PWRON  -> GPIO5 through an inverting FET, so it reads high while the power key is held
#   PWROK  -> ESP32 reset (EN)
i2c_device:
  id: pmic
  address: 0x34

spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11

psram:
  mode: octal

api:
  actions:
    - action: epaper_render
      then:
        - component.update: my_display
  # Read the climate and WiFi sensors once per wake, as soon as Home Assistant is listening.
  on_client_connected:
    - component.update: climate
    - component.update: wifi_signal_sensor

deep_sleep:
  id: deep_sleep_control
  # KEY button: press to wake the frame early and get the next image.
  wakeup_pin:
    number: GPIO4
    inverted: true
    mode:
      input: true
      pullup: true

# Wake cycle: boot -> wait for the server to push an image -> refresh the panel -> sleep.
script:
  - id: start_cycle
    then:
      - if:
          condition:
            lambda: |-
              // AXP2101 reg 0x00: bit 5 = USB power present, bit 3 = battery connected.
              uint8_t status, percent;
              if (!id(pmic).read_byte(0x00, &status) || !id(pmic).read_byte(0xA4, &percent)) {
                return false;
              }
              return (status & 0x08) && !(status & 0x20) && percent < ${low_battery_percent};
          then:
            - logger.log:
                level: WARN
                format: "Battery low, sleeping without refreshing"
            - script.execute: rails_off
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: ${low_battery_sleep}
          else:
            - script.execute: awake_timeout
            - script.execute: connect_to_server
  # Dial the server set in Server URL instead of waiting for it to find the frame over mDNS.
  - id: connect_to_server
    mode: restart
    then:
      - wait_until:
          condition:
            and:
              - wifi.connected:
              - lambda: return id(sendspin_hub).is_ready();
      - lambda: |-
          const std::string &url = id(server_url).state;
          if (url.empty()) {
            return;
          }
          if (url.rfind("ws://", 0) != 0) {
            ESP_LOGW("sendspin", "Server URL must start with ws://, ignoring '%s'", url.c_str());
            return;
          }
          id(sendspin_hub).connect_to_server(url);
  # Nothing arrived in time (server down or no image due), so sleep and try again next cycle.
  - id: awake_timeout
    mode: restart
    then:
      - delay: ${max_awake_time}
      - logger.log:
          level: WARN
          format: "No image received, going back to sleep"
      - script.execute: enter_sleep
  - id: render_and_sleep
    mode: single
    then:
      - script.stop: awake_timeout
      - component.update: my_display
      # update only starts the refresh; the display goes idle again once the panel is done.
      - wait_until:
          condition:
            lambda: return id(my_display).is_idle();
          timeout: 2min
      - event.trigger:
          id: rendering_events
          event_type: render_complete
      - delay: ${post_render_delay}
      - script.execute: enter_sleep
  # Sleeps unless Stay Awake is on or the frame is on USB power.
  - id: enter_sleep
    then:
      - if:
          condition:
            and:
              - switch.is_off: stay_awake
              - lambda: |-
                  uint8_t status;
                  return !id(pmic).read_byte(0x00, &status) || !(status & 0x20);
          then:
            - sensor.template.publish:
                id: awake_time
                state: !lambda return millis() / 1000.0f;
            # Give the events and sensor states time to reach Home Assistant.
            - delay: 2s
            - script.execute: rails_off
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: !lambda return (uint32_t) (id(sleep_duration).state * 1000);
  # Run right before deep sleep. on_boot switches the rails back on at the next wake.
  - id: rails_off
    then:
      - lambda: |-
          if (!${rails_off_in_sleep}) {
            return;
          }
          uint8_t ldo;
          if (id(pmic).read_byte(0x90, &ldo)) {
            id(pmic).write_byte(0x90, ldo & ~0x0C);
          }

switch:
  # Turn on while the frame is awake to keep it up for OTA updates or debugging.
  - platform: template
    id: stay_awake
    name: Stay Awake
    icon: "mdi:sleep-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - script.execute: awake_timeout

text:
  # ws://<server>:8927/sendspin. Leave empty to let the server find the frame over mDNS.
  - platform: template
    id: server_url
    name: Server URL
    icon: "mdi:server-network"
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: connect_to_server

binary_sensor:
  # While on USB power the frame stays awake, so it can be updated over the air.
  - platform: template
    id: usb_power
    name: USB Power
    device_class: plug
    entity_category: diagnostic
    on_release:
      # Unplugged: go back to the normal cycle, unless a refresh is already on its way to sleep.
      - if:
          condition:
            not:
              script.is_running: render_and_sleep
          then:
            - script.execute: awake_timeout

text_sensor:
  - platform: template
    id: charging_state
    name: Charging State
    icon: "mdi:battery-charging"
    entity_category: diagnostic

interval:
  - interval: 5s
    then:
      - lambda: |-
          // AXP2101 reg 0x00 bit 5 = USB power present, reg 0x01 bits 2:0 = charger state.
          uint8_t status, charger;
          if (!id(pmic).read_byte(0x00, &status) || !id(pmic).read_byte(0x01, &charger)) {
            return;
          }
          id(usb_power).publish_state(status & 0x20);
          static const char *const STATES[] = {"Trickle", "Precharge", "Constant current",
                                               "Constant voltage", "Done", "Not charging"};
          charger &= 0x07;
          const char *state = charger < 6 ? STATES[charger] : "Unknown";
          if (id(charging_state).state != state) {
            id(charging_state).publish_state(state);
          }

event:
  - platform: template
    name: Rendering
    id: rendering_events
    icon: "mdi:brush"
    event_types:
      - render_complete
  - platform: template
    name: Image Downloading
    id: image_downloading_events
    icon: "mdi:download"
    event_types:
      - image_downloading_complete
      - image_downloading_failed

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

image:
  - platform: sendspin
    id: sendspin_artwork
    sendspin_id: sendspin_hub
    format: PNG
    type: RGB
    resize: ${display_pixel_height}x${display_pixel_width}
    source: ALBUM
    current_image:
      id: sendspin_cover_art
    on_image_display:
      - logger.log: "Cover art received"
      - event.trigger:
          id: image_downloading_events
          event_type: image_downloading_complete
      - script.execute: render_and_sleep
    on_image_error:
      - logger.log:
          level: ERROR
          format: "Failed to decode cover art image"
      - event.trigger:
          id: image_downloading_events
          event_type: image_downloading_failed
      - script.stop: awake_timeout
      - script.execute: enter_sleep

display:
  - platform: epaper_spi
    id: my_display
    model: Spectra-E6
    cs_pin: GPIO9
    dc_pin: GPIO8
    dimensions:
      width: ${display_pixel_width}
      height: ${display_pixel_height}
    busy_pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
        pullup: true
    reset_pin:
      number: GPIO12
    update_interval: never
    rotation: ${display_rotation}
    lambda: |-
      it.image(0, 0, id(sendspin_cover_art));

sensor:
  # Never polled: api on_client_connected reads these once per wake.
  - platform: shtcx
    id: climate
    update_interval: never
    temperature:
      id: temperature
      name: Temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
    humidity:
      id: humidity
      name: Humidity
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
  # Short intervals so every wake cycle reports at least once before sleeping.
  - platform: template
    name: Battery Percent
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // AXP2101 reg 0xA4 = battery percentage
      uint8_t percent;
      if (!id(pmic).read_byte(0xA4, &percent)) {
        return {};
      }
      return percent;
  - platform: template
    name: Battery Voltage
    device_class: voltage
    state_class: measurement
    unit_of_measurement: V
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      // AXP2101 regs 0x34/0x35 = battery voltage in mV (upper 5 bits, lower 8 bits)
      uint8_t high, low;
      if (!id(pmic).read_byte(0x34, &high) || !id(pmic).read_byte(0x35, &low)) {
        return {};
      }
      return (((high & 0x1F) << 8) | low) / 1000.0f;
  - platform: wifi_signal
    id: wifi_signal_sensor
    name: WiFi Signal
    update_interval: never
  # How long the frame was up this cycle, published just before it sleeps.
  - platform: template
    id: awake_time
    name: Awake Time
    device_class: duration
    state_class: measurement
    unit_of_measurement: s
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never

number:
  - platform: template
    id: sleep_duration
    name: Sleep Duration
    max_value: 86400
    min_value: 30
    step: 30
    mode: box
    device_class: duration
    unit_of_measurement: s
    entity_category: config
    optimistic: true
    initial_value: 3600
    restore_value: true
