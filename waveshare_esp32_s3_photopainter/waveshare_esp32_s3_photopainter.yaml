substitutions:
  device_name: photo-frame-1
  device_friendly_name: Photo Frame 1
  display_pixel_width: '800'
  display_pixel_height: '480'
  display_rotation: '270°'
  # Longest the frame stays awake waiting for an image before it gives up and sleeps anyway.
  max_awake_time: 60s

packages:
  base:
    url: https://github.com/vantreeseba/home_automation
    ref: main
    files:
      - shared_packages/default_base.yaml

esphome:
  # First release with the sendspin image platform and no external components needed.
  min_version: 2026.9.0
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            // AXP2101 rails, all 3.3V as in Waveshare's firmware.
            // DCDC1 (0x82) = 1500mV + n*100mV, ALDO1-4 (0x92-0x95) = 500mV + n*100mV.
            static const uint8_t RAILS[][2] = {{0x82, 0x12}, {0x92, 0x1C}, {0x93, 0x1C}, {0x94, 0x1C}, {0x95, 0x1C}};
            for (const auto &rail : RAILS) {
              uint8_t current;
              if (!id(pmic).read_byte(rail[0], &current)) {
                ESP_LOGW("pmic", "Could not read rail register 0x%02X", rail[0]);
                continue;
              }
              if ((current & 0x1F) != rail[1]) {
                id(pmic).write_byte(rail[0], (current & 0xE0) | rail[1]);
              }
            }
    - priority: -100
      then:
        - script.execute: awake_timeout

i2c:
  id: bus
  sda: GPIO47
  scl: GPIO48
  scan: true
  frequency: 100kHz

i2c_device:
  id: pmic
  address: 0x34

spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11

psram:
  mode: octal

api:
  actions:
    - action: epaper_render
      then:
        - component.update: my_display

deep_sleep:
  id: deep_sleep_control

# Wake cycle: boot -> wait for the server to push an image -> refresh the panel -> sleep.
script:
  # Nothing arrived in time (server down or no image due), so sleep and try again next cycle.
  - id: awake_timeout
    mode: restart
    then:
      - delay: ${max_awake_time}
      - logger.log:
          level: WARN
          format: "No image received, going back to sleep"
      - script.execute: enter_sleep
  - id: render_and_sleep
    mode: single
    then:
      - script.stop: awake_timeout
      - component.update: my_display
      # update only starts the refresh; the display goes idle again once the panel is done.
      - wait_until:
          condition:
            lambda: return id(my_display).is_idle();
          timeout: 2min
      - event.trigger:
          id: rendering_events
          event_type: render_complete
      # Give the event and sensor states time to reach Home Assistant.
      - delay: 2s
      - script.execute: enter_sleep
  - id: enter_sleep
    then:
      - if:
          condition:
            switch.is_off: stay_awake
          then:
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: !lambda return (uint32_t) (id(sleep_duration).state * 1000);

switch:
  # Turn on while the frame is awake to keep it up for OTA updates or debugging.
  - platform: template
    id: stay_awake
    name: Stay Awake
    icon: "mdi:sleep-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - script.execute: awake_timeout

event:
  - platform: template
    name: Rendering
    id: rendering_events
    icon: "mdi:brush"
    event_types:
      - render_complete
  - platform: template
    name: Image Downloading
    id: image_downloading_events
    icon: "mdi:download"
    event_types:
      - image_downloading_complete
      - image_downloading_failed

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

image:
  - platform: sendspin
    id: sendspin_artwork
    sendspin_id: sendspin_hub
    format: PNG
    type: RGB
    resize: ${display_pixel_height}x${display_pixel_width}
    source: ALBUM
    current_image:
      id: sendspin_cover_art
    on_image_display:
      - logger.log: "Cover art received"
      - event.trigger:
          id: image_downloading_events
          event_type: image_downloading_complete
      - script.execute: render_and_sleep
    on_image_error:
      - logger.log:
          level: ERROR
          format: "Failed to decode cover art image"
      - event.trigger:
          id: image_downloading_events
          event_type: image_downloading_failed
      - script.stop: awake_timeout
      - delay: 2s
      - script.execute: enter_sleep

display:
  - platform: epaper_spi
    id: my_display
    model: Spectra-E6
    cs_pin: GPIO9
    dc_pin: GPIO8
    dimensions:
      width: ${display_pixel_width}
      height: ${display_pixel_height}
    busy_pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
        pullup: true
    reset_pin:
      number: GPIO12
    update_interval: never
    rotation: ${display_rotation}
    lambda: |-
      it.image(0, 0, id(sendspin_cover_art));

sensor:
  # Short intervals so every wake cycle reports at least once before sleeping.
  - platform: shtcx
    update_interval: 15s
    temperature:
      id: temperature
      name: Temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
    humidity:
      id: humidity
      name: Humidity
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
  - platform: template
    name: Battery Percent
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // AXP2101 reg 0xA4 = battery percentage
      uint8_t percent;
      if (!id(pmic).read_byte(0xA4, &percent)) {
        return {};
      }
      return percent;

number:
  - platform: template
    id: sleep_duration
    name: Sleep Duration
    max_value: 3600
    min_value: 30
    step: 30
    device_class: duration
    unit_of_measurement: s
    entity_category: config
    optimistic: true
    initial_value: 360
    restore_value: true
